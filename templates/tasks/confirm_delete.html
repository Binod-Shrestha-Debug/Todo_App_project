{% extends "base.html" %}
{% block page_title %}Delete task{% endblock %}
{% block content %}<div class="content-card confirm-card"><div class="empty-icon">!</div><h2>Delete “{{ task.title }}”?</h2><p class="muted">This action cannot be undone.</p><form method="post">{% csrf_token %}<a class="secondary-btn" href="{% url 'task_detail' task.pk %}">Cancel</a> <button class="danger-btn">Yes, delete task</button></form></div>{% endblock %}
